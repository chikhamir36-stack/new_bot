services:
  - type: web
    name: discord-bot
    runtime: python
    repo: https://github.com/your-username/your-repo
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python3.11 main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
    version: "3.11"
